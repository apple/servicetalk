name: Test with the latest Netty Snapshots
permissions:
  contents: read
on:
  schedule:
    - cron: '0 15 * * 1-5'
  workflow_dispatch:
env:
  JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
jobs:
  gradle-wrapper-validation:
    uses: ./.github/workflows/gradle-wrapper-validation.yml
  build:
    needs: gradle-wrapper-validation
    permissions:
      contents: read
      checks: write
    name: Netty ${{ matrix.netty }} Snapshot
    runs-on: ${{ matrix.os }}
    env:
      ORG_GRADLE_PROJECT_testNettyVersion: ${{ matrix.netty }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        netty: [ 4.1+, 4.2.+ ]
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: 17
          distribution: 'zulu'
          cache: 'gradle'
      - name: Print JDK Version
        run: java -version
      - name: Make gradlew Executable
        run: chmod +x gradlew
      - name: Print Netty Version
        run: ./gradlew :servicetalk-http-netty:dependencyInsight --configuration testRuntimeClasspath --dependency io.netty:netty-codec-http2 | head -n 50
      - name: Clean Gradle project
        run: ./gradlew --parallel clean
      - name: Build and Test
        run:  sudo -E env "PATH=$PATH" bash -c "ulimit -l 65536 && ulimit -a && ./gradlew --no-daemon --parallel test"
      - name: Publish Test Results
        if: '!cancelled()'
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
        with:
          files: '**/build/test-results/test/TEST-*.xml'
          check_name: Test Report Netty ${{ matrix.netty }} Snapshot
          comment_mode: 'off'

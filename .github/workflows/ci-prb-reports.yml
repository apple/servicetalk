name: PR Builder Reports
permissions:
  contents: read
on:
  workflow_run:
    workflows: [ "PR Builder" ]
    types:
      - completed
jobs:
  tests:
    # A fork PR controls the artifacts its run uploads, and this job republishes them verbatim
    # with checks: write. Only consume artifacts produced by a run on this repository.
    if: >-
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.conclusion == 'success' ||
      github.event.workflow_run.conclusion == 'failure')
    permissions:
      actions: read
      checks: write
    runs-on: ubuntu-latest
    strategy:
      # Matrix should be coordinated with ci-prb.yml.
      matrix:
        java: [ 8, 11, 17, 21, 25 ]
        os: [ ubuntu-latest ]
        os_label: [ ubuntu ]
        include:
          - java: 11
            os: [self-hosted, macos, general]
            os_label: macos
          # FIXME: 0.43 - remove after dropping support for Netty 4.1.x
          - java: 11
            os: ubuntu-latest
            os_label: ubuntu-netty-4.1
            netty: '4.1.+'
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          # File location set in ci-prb.yml and must be coordinated.
          name: test-results-${{ matrix.os_label }}-${{ matrix.java }}
      - name: Publish Test Report
        uses: EnricoMi/publish-unit-test-result-action@7622c5bf3d112a72ab4fa3951c2aa5723d8ab92d # v2.25.0
        with:
          files: '**/build/test-results/test/TEST-*.xml'
          commit: ${{ github.event.workflow_run.head_commit.id }}
          check_name: Test Report JDK ${{ matrix.java }} ${{ matrix.os_label }}
          comment_mode: 'off'
